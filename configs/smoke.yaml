# Fast end-to-end check using the hand-built reference inits (no API calls).
# Should finish in a few minutes on a laptop. Not an experimental result.
tasks: [sparse_parity, ring2d, gridnav]
arms:
  - {name: random, kind: random}
  - {name: reference, kind: written, source: reference}
  - {name: reference_noise, kind: written_noise, source: reference, alpha: 0.1}
  - {name: reference_shuffled_noise, kind: shuffled_noise, source: reference, alpha: 0.1}
  - {name: reference_norm_matched, kind: norm_matched, source: reference}
  - {name: reference_shuffled, kind: shuffled, source: reference}   # secondary (dead-unit confound)
budgets: [0, 16, 128, 1024]
seeds: [0, 1]
lr: [1.0e-3, 1.0e-2]
weight_decay: [0.0]
optimizer: adamw
batch_size: 64
max_steps: 600
eval_every: 50
patience: 4
val_size: 256
test_size: 2000
workers: 0
require_audited: false
